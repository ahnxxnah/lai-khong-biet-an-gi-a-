<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LẠI KHÔNG BIẾT ĂN GÌ À?</title><style>body{font-family:system-ui;background:#fff7ed;color:#422006;margin:0}header{background:#ea580c;color:white;padding:24px;text-align:center}main{max-width:1050px;margin:auto;padding:18px}nav{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:#f97316;color:white;font-weight:700}button.secondary{background:#fed7aa;color:#7c2d12}.panel{background:white;padding:20px;border-radius:16px;margin:15px 0;box-shadow:0 3px 16px #9a34121c}label{display:block;margin:10px 0 4px;font-weight:600}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #fdba74;border-radius:9px;background:white;font:inherit}input[type=checkbox]{width:auto} .checks{display:flex;gap:14px;flex-wrap:wrap}.checks label{font-weight:400} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.hidden{display:none}.item{border:1px solid #fed7aa;padding:13px;border-radius:12px;margin:10px 0}table{width:100%;border-collapse:collapse;min-width:620px}th,td{border:1px solid #fed7aa;padding:9px;text-align:left}th{background:#ffedd5}.scroll{overflow:auto}.muted{color:#9a3412}h2{margin-top:0} .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}</style></head><body><header><h1>🍜 LẠI KHÔNG BIẾT ĂN GÌ À?</h1><p>Hôm nay ăn gì, uống gì, đi đâu? Để ứng dụng giúp bạn chọn!</p></header><main><nav><button onclick="tab('plan')">✨ LẬP KẾ HOẠCH</button><button onclick="tab('places')">📋 DANH SÁCH</button><button onclick="tab('history')">🕘 LỊCH SỬ</button></nav><section id="plan" class="panel"><h2>Lập kế hoạch</h2><div class="grid"><div><label>Số người</label><input id="people" type="number" min="1" value="2"></div><div><label>Thời gian</label><select id="time"><option value="sáng">Sáng</option><option value="trưa">Trưa</option><option value="tối">Tối</option></select></div><div><label>Đối tượng</label><select id="audience"><option value="cả hai">Cả trẻ em và người lớn</option><option value="trẻ em">Trẻ em</option><option value="người lớn">Người lớn</option></select></div><div><label>Ngân sách tổng (VNĐ)</label><input id="budget" type="number" min="0" value="300000"></div><div><label>Phương tiện</label><select id="vehicle"><option value="tất cả">Tất cả</option><option value="ô tô">Ô tô</option><option value="xe máy">Xe máy</option><option value="đi bộ">Đi bộ</option></select></div><div><label>Số gợi ý mong muốn</label><input id="count" type="number" min="1" value="3"></div></div><label>Mục đích chuyến đi (chọn nhiều)</label><div id="purposes" class="checks"></div><div class="actions"><button onclick="generate()">✨ LẬP KẾ HOẠCH</button></div><div id="results"></div></section><section id="places" class="panel hidden"><h2>Danh sách địa điểm của tôi</h2><form id="placeForm"><input type="hidden" id="editId"><div class="grid"><div><label>Nhóm mục đích</label><select id="category"><option>Mua hàng hóa</option><option>Địa điểm chơi</option><option>Món ăn</option><option>Đồ uống</option></select></div><div><label>Tên địa điểm *</label><input id="name" required></div><div><label>Thời gian phục vụ</label><input id="hours" placeholder="VD: 07:00–22:00"></div><div><label>Phục vụ buổi</label><div class="checks" id="serves"></div></div><div><label>Phù hợp cho</label><select id="fit"><option value="cả hai">Cả hai</option><option value="trẻ em">Trẻ em</option><option value="người lớn">Người lớn</option></select></div><div><label>Tầm giá/người (VNĐ)</label><input id="price" type="number" min="0" value="50000"></div><div><label>Phương tiện phù hợp</label><div id="vehicles" class="checks"></div></div><div><label>Thông tin liên hệ</label><input id="contact" placeholder="Số điện thoại, website..."></div><div><label>Địa chỉ</label><input id="address"></div></div><label>Thực đơn (tên món + giá, thêm nhiều lần)</label><div id="menuRows"></div><button type="button" class="secondary" onclick="addMenu()">+ Thêm món</button><label>Ghi chú (sẽ nhắc khi gợi ý lần sau)</label><textarea id="note" rows="3"></textarea><div class="actions"><button type="submit">💾 Lưu địa điểm</button><button type="button" class="secondary" onclick="resetForm()">Làm mới</button></div></form><hr><h2>Địa điểm đã lưu</h2><input id="search" placeholder="Tìm theo tên, địa chỉ, nhóm..." oninput="renderPlaces()"><div id="placeList"></div></section><section id="history" class="panel hidden"><h2>Lịch sử gợi ý</h2><div id="historyList"></div></section></main><script>
const cats=['Mua hàng hóa','Địa điểm chơi','Món ăn','Đồ uống'],times=['sáng','trưa','tối'],modes=['ô tô','xe máy','đi bộ'];const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('vi-VN')+' đ',safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let places=JSON.parse(localStorage.getItem('food_places_v1')||'[]'),history=JSON.parse(localStorage.getItem('food_history_v1')||'[]');const save=()=>{localStorage.setItem('food_places_v1',JSON.stringify(places));localStorage.setItem('food_history_v1',JSON.stringify(history))};function checkHTML(values,prefix,checked=true){return values.map(v=>`<label><input type="checkbox" data-group="${prefix}" value="${safe(v)}" ${checked?'checked':''}> ${safe(v)}</label>`).join('')}function checked(group){return [...document.querySelectorAll(`[data-group="${group}"]:checked`)].map(x=>x.value)}$('purposes').innerHTML=checkHTML(cats,'purpose');$('serves').innerHTML=checkHTML(times,'serve');$('vehicles').innerHTML=checkHTML(modes,'mode');function tab(t){['plan','places','history'].forEach(x=>$(x).classList.toggle('hidden',x!==t));if(t==='places')renderPlaces();if(t==='history')renderHistory()}function addMenu(n='',p=''){let d=document.createElement('div');d.className='grid item';d.innerHTML=`<div><label>Tên món</label><input class="mn" value="${safe(n)}"></div><div><label>Giá (VNĐ)</label><input class="mp" type="number" min="0" value="${Number(p)||0}"></div><div><label>&nbsp;</label><button type="button" class="secondary" onclick="this.closest('.item').remove()">Xóa món</button></div>`;$('menuRows').append(d)}addMenu();function resetForm(){$('placeForm').reset();$('editId').value='';$('menuRows').innerHTML='';addMenu();document.querySelectorAll('[data-group="serve"],[data-group="mode"]').forEach(x=>x.checked=true)}$('placeForm').onsubmit=e=>{e.preventDefault();let id=$('editId').value||String(Date.now()),p={id,category:$('category').value,name:$('name').value.trim(),hours:$('hours').value,serves:checked('serve'),fit:$('fit').value,price:+$('price').value,vehicles:checked('mode'),contact:$('contact').value,address:$('address').value,note:$('note').value,menu:[...$('menuRows').children].map(r=>({name:r.querySelector('.mn').value.trim(),price:+r.querySelector('.mp').value})).filter(x=>x.name)};if(!p.name)return alert('Vui lòng nhập tên địa điểm');if(!p.serves.length||!p.vehicles.length)return alert('Chọn ít nhất một buổi và phương tiện');let i=places.findIndex(x=>x.id===id);if(i<0)places.push(p);else places[i]=p;save();resetForm();renderPlaces();alert('Đã lưu địa điểm!')};function renderPlaces(){let q=$('search').value.toLowerCase(),list=places.filter(p=>[p.name,p.address,p.category].join(' ').toLowerCase().includes(q));$('placeList').innerHTML=list.length?list.map(p=>`<div class="item"><b>${safe(p.name)}</b> — ${safe(p.category)}<p>${safe(p.address)} · ${money(p.price)}/người · ${safe(p.hours)}</p><p>${safe(p.menu.map(m=>m.name+' ('+money(m.price)+')').join(', '))}</p>${p.note?`<p>📝 ${safe(p.note)}</p>`:''}<div class="actions"><button onclick="editPlace('${p.id}')">Sửa</button><button class="secondary" onclick="deletePlace('${p.id}')">Xóa</button></div></div>`).join(''):'<p class="muted">Chưa có địa điểm phù hợp. Hãy thêm địa điểm đầu tiên.</p>'}function editPlace(id){let p=places.find(x=>x.id===id);if(!p)return;tab('places');['editId','category','name','hours','fit','price','contact','address','note'].forEach(k=>$(k).value=k==='editId'?p.id:p[k]??'');document.querySelectorAll('[data-group="serve"]').forEach(x=>x.checked=p.serves.includes(x.value));document.querySelectorAll('[data-group="mode"]').forEach(x=>x.checked=p.vehicles.includes(x.value));$('menuRows').innerHTML='';(p.menu.length?p.menu:[{name:'',price:0}]).forEach(m=>addMenu(m.name,m.price));$('placeForm').scrollIntoView({behavior:'smooth'})}function deletePlace(id){if(confirm('Xóa địa điểm này?')){places=places.filter(p=>p.id!==id);save();renderPlaces()}}function generate(){let purpose=checked('purpose'),people=+$('people').value,budget=+$('budget').value,count=+$('count').value,time=$('time').value,fit=$('audience').value,vehicle=$('vehicle').value;if(!purpose.length||people<1||count<1||budget<0)return alert('Kiểm tra mục đích, số người, số gợi ý và ngân sách');let matched=places.filter(p=>purpose.includes(p.category)&&p.serves.includes(time)&&(fit==='cả hai'?p.fit==='cả hai':p.fit===fit||p.fit==='cả hai')&&(vehicle==='tất cả'||p.vehicles.includes(vehicle))&&p.price*people<=budget).sort((a,b)=>a.price-b.price).slice(0,count);let request={purpose,people,budget,count,time,fit,vehicle};$('results').innerHTML=showSuggestions(matched,request,true);window.lastResult={matched:matched.map(p=>({...p})),request};}function showSuggestions(arr,r,allowSave){if(!arr.length)return '<p class="muted">Không tìm thấy địa điểm đáp ứng đầy đủ tiêu chí. Hãy bổ sung địa điểm hoặc điều chỉnh ngân sách, buổi, đối tượng, phương tiện.</p>';let html=`<h2>🎉 ${arr.length} gợi ý phù hợp</h2><p>${r.people} người · ${safe(r.time)} · ngân sách ${money(r.budget)} · ${safe(r.vehicle)}</p>`+arr.map((p,i)=>`<div class="item"><h3>${i+1}. ${safe(p.name)}</h3><p>${safe(p.category)} · Dự tính ${money(p.price*r.people)} cho ${r.people} người</p><p>📍 ${safe(p.address||'Chưa có địa chỉ')} · ⏰ ${safe(p.hours||'Chưa có giờ')}</p><p>📞 ${safe(p.contact||'Chưa có liên hệ')}</p>${p.menu.length?`<p>🍽 ${p.menu.map(m=>safe(m.name)+' — '+money(m.price)).join('; ')}</p>`:''}${p.note?`<p><b>🔔 Ghi chú cần nhớ:</b> ${safe(p.note)}</p>`:''}</div>`).join('');if(arr.length>1)html+=`<h3>📊 Bảng so sánh</h3><div class="scroll"><table><tr><th>Địa điểm</th><th>Nhóm</th><th>Giá dự tính / nhóm</th><th>Thời gian</th><th>Địa chỉ</th><th>Ghi chú</th></tr>${arr.map(p=>`<tr><td>${safe(p.name)}</td><td>${safe(p.category)}</td><td>${money(p.price*r.people)}</td><td>${safe(p.hours)}</td><td>${safe(p.address)}</td><td>${safe(p.note)}</td></tr>`).join('')}</table></div>`;if(allowSave)html+='<button onclick="saveResult()">💾 Lưu gợi ý vào lịch sử</button>';return html}function saveResult(){if(!window.lastResult||!window.lastResult.matched.length)return;history.unshift({id:String(Date.now()),date:new Date().toLocaleString('vi-VN'),...window.lastResult});save();alert('Đã lưu gợi ý vào lịch sử!')}function renderHistory(){$('historyList').innerHTML=history.length?history.map(h=>`<div class="item"><b>🕘 ${safe(h.date)}</b><p>${safe(h.matched.map(p=>p.name).join(' · '))}</p><div class="actions"><button onclick="viewHistory('${h.id}')">Xem lại</button><button class="secondary" onclick="removeHistory('${h.id}')">Xóa</button></div><div id="history-${h.id}"></div></div>`).join(''):'<p class="muted">Chưa có lịch sử gợi ý.</p>'}function viewHistory(id){let h=history.find(x=>x.id===id);if(h)$('history-'+id).innerHTML=showSuggestions(h.matched,h.request,false)}function removeHistory(id){if(confirm('Xóa gợi ý này khỏi lịch sử?')){history=history.filter(h=>h.id!==id);save();renderHistory()}}renderPlaces();</script></body></html>
